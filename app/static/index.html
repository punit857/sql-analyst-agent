<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL Analyst Agent</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%234f7df0'/><stop offset='1' stop-color='%2335b2b0'/></linearGradient></defs><rect width='100' height='100' rx='26' fill='url(%23g)'/><text x='50' y='69' font-size='56' text-anchor='middle' font-family='Georgia,serif' fill='white'>S</text></svg>">
<style>
:root{--bg:#0b0e14;--p:rgba(255,255,255,.035);--p2:rgba(255,255,255,.065);--ln:rgba(255,255,255,.08);--ln2:rgba(255,255,255,.15);--tx:#e8ecf4;--mu:#8a93a6;--a1:#5b8def;--a2:#3fb8af;--a3:#8b8cf0;--gold:#d4b26a;--bad:#d98593;--grad:linear-gradient(135deg,#4f7df0,#35b2b0);--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:"Iowan Old Style",Georgia,serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 var(--sans);overflow:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(640px 420px at 18% -8%,rgba(79,125,240,.20),transparent),radial-gradient(560px 420px at 100% 100%,rgba(53,178,176,.13),transparent)}
.ns{scrollbar-width:none}.ns::-webkit-scrollbar{display:none}
.muted{color:var(--mu)}.small{font-size:12.5px}
.shell{height:100%;display:grid;grid-template-columns:292px minmax(0,1fr)}

/* ---------- sidebar ---------- */
aside.side{display:flex;flex-direction:column;gap:22px;padding:22px 16px;border-right:1px solid var(--ln);background:rgba(255,255,255,.018);overflow-y:auto;min-height:0}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--grad);display:grid;place-items:center;font:700 19px var(--serif);color:#fff;box-shadow:0 6px 20px rgba(79,125,240,.35);flex:none}
.brand h1{font:700 16px/1.2 var(--sans);margin:0;letter-spacing:-.01em}
.brand div div{font-size:12px;color:var(--mu)}
.sec{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#6d768a;font-weight:700;padding:0 8px 8px}
.nav{display:flex;flex-direction:column;gap:3px}
.navbtn{--c:var(--a1);display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 12px;border:1px solid transparent;border-radius:11px;background:transparent;color:#aab2c4;cursor:pointer;font:inherit;font-size:14px;transition:.2s}
.navbtn:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);opacity:.7;flex:none;transition:.2s}
.navbtn:hover{background:var(--p);color:var(--tx)}
.navbtn.on{background:var(--p2);border-color:var(--ln);color:var(--tx)}
.navbtn.on:before{opacity:1;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
.card{margin:0 4px;padding:14px;border-radius:14px;background:var(--p);border:1px solid var(--ln);animation:rise .4s ease both}
.card h3{margin:0 0 4px;font:600 15px var(--sans);overflow-wrap:anywhere}
.card p{margin:0 0 10px;font-size:12.5px;color:var(--mu);line-height:1.5}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pill{--c:var(--a1);display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;background:var(--p2);color:#cdd3e2;border:1px solid var(--ln)}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.cols{display:flex;flex-wrap:wrap;gap:6px}
.col{--c:var(--gold);display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln);border-radius:8px;padding:2px 9px;font-size:12px;background:rgba(255,255,255,.03);overflow-wrap:anywhere}
.col:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
.col i{color:var(--mu);font-style:normal;font-size:11px}
.col.integer{--c:var(--a2)}.col.real{--c:var(--a1)}.col.date_text{--c:var(--a3)}
.tbl{margin-top:6px;border:1px solid var(--ln);border-radius:10px;background:rgba(255,255,255,.025)}
.tbl summary{padding:7px 11px;color:var(--tx);font-size:13px;display:flex;justify-content:space-between;gap:8px}
.tbl summary span{color:var(--mu);font-size:11.5px}
.tbl .cols{padding:0 10px 10px}
.notes{margin-top:14px;padding-top:12px;border-top:1px solid var(--ln)}
.notes h4{margin:0 0 4px;font:600 13px var(--sans)}
.notes p{margin:0 0 8px;font-size:12px;color:var(--mu);line-height:1.5}
.notes textarea{width:100%;resize:vertical;min-height:84px;max-height:200px;background:rgba(0,0,0,.2);border:1px solid var(--ln2);border-radius:10px;color:var(--tx);padding:8px 10px;font:inherit;font-size:12.5px;line-height:1.5;outline:none;transition:.2s}
.notes textarea:focus{border-color:var(--a1);box-shadow:0 0 0 3px rgba(91,141,239,.15)}
.nfoot{display:flex;align-items:center;gap:10px;margin-top:8px}
.nfoot .st{flex:1;font-size:11.5px;color:var(--mu)}
.nfoot .st.bad{color:var(--bad)}
.savebtn{border:1px solid var(--ln2);background:var(--p2);color:var(--tx);border-radius:999px;padding:3px 16px;font:inherit;font-size:12.5px;cursor:pointer;transition:.2s}
.savebtn:hover:not(:disabled){border-color:var(--a1)}
.savebtn:disabled{opacity:.5;cursor:default}
.priv{margin:0 4px;font-size:11.5px;color:#6d768a;line-height:1.5}
.linkbtn{border:0;background:none;color:var(--mu);text-decoration:underline;cursor:pointer;font:inherit;font-size:12.5px;padding:0;margin-top:12px;display:block}
.linkbtn:hover{color:var(--tx)}

/* ---------- main column ---------- */
.mainc{display:flex;flex-direction:column;min-width:0;min-height:0}
.mbar{display:none;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--ln)}
.menu{border:1px solid var(--ln2);background:var(--p);color:var(--tx);border-radius:10px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
#wake{display:none;margin:12px 28px 0;padding:10px 14px;border-radius:12px;background:var(--p2);border:1px solid var(--ln2);align-items:center;gap:10px;color:var(--mu);font-size:13.5px}
#wake.show{display:flex}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--ln2);border-top-color:var(--a2);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.scroller{flex:1;min-height:0;overflow-y:auto;scroll-behavior:smooth}
#chat{display:flex;flex-direction:column;gap:22px;max-width:820px;margin:0 auto;padding:26px 28px 30px}
.msg{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.user{align-self:flex-end;max-width:80%;background:var(--grad);color:#fff;padding:10px 18px;border-radius:20px 20px 5px 20px;overflow-wrap:anywhere;box-shadow:0 8px 22px rgba(79,125,240,.22)}
.bot{min-width:0;padding:20px 22px;border-radius:18px;background:var(--p);border:1px solid var(--ln)}
.hello{background:none;border:0;padding:26px 0 0}
.hello h2{margin:0 0 8px;font:700 36px/1.14 var(--sans);letter-spacing:-.025em;background:linear-gradient(135deg,#a9c0ff,#6fdcd2);-webkit-background-clip:text;background-clip:text;color:transparent}
.hello p{margin:0 0 20px;max-width:560px}
.think{display:flex;align-items:center;gap:12px}
.dots span{display:inline-block;width:7px;height:7px;margin-right:5px;border-radius:50%;background:var(--a1);animation:bounce 1.1s infinite}
.dots span:nth-child(2){animation-delay:.15s;background:var(--a2)}
.dots span:nth-child(3){animation-delay:.3s;background:var(--a3)}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-6px);opacity:1}}
.tag{display:inline-flex;align-items:center;padding:3px 12px;border-radius:999px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;margin-bottom:10px;color:var(--gold);background:rgba(212,178,106,.12)}
.tag.bad{color:var(--bad);background:rgba(217,133,147,.12)}
.hero{display:flex;flex-direction:column;align-items:flex-start;margin:0 0 6px}
.hero b{font:800 58px/1.05 var(--sans);letter-spacing:-.03em;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,#b4c8ff,#6fdcd2);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero span{margin-top:8px;padding:2px 12px;border-radius:999px;background:var(--p2);color:var(--mu);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.answer{font:400 16.5px/1.7 var(--sans);margin:12px 0 16px;overflow-wrap:anywhere;max-width:760px;color:#dde2ef}
.answer.plain{margin-top:2px}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;margin:0 0 12px;border-radius:12px;background:rgba(212,178,106,.08);border:1px solid rgba(212,178,106,.24);color:#e6d3a3;font-size:13px}
.note span:first-child{flex:none;width:18px;height:18px;border-radius:50%;background:var(--gold);color:#1a1608;display:grid;place-items:center;font-weight:800;font-size:12px}
.chartbox{height:300px;margin:6px 0 16px;padding:16px 14px 10px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid var(--ln)}
.tablewrap{max-height:270px;overflow:auto;border:1px solid var(--ln);border-radius:12px;background:rgba(0,0,0,.16);margin-bottom:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:#151a26;text-align:left;color:var(--mu);font-weight:600;font-size:11px;letter-spacing:.07em;text-transform:uppercase;padding:10px 14px;white-space:nowrap}
td{padding:9px 14px;border-top:1px solid var(--ln);white-space:nowrap}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:rgba(91,141,239,.08)}
details.sql{position:relative;margin-top:12px;border:1px solid var(--ln);border-radius:12px;background:rgba(0,0,0,.22)}
details.sql summary{padding:9px 14px}
summary{cursor:pointer;color:var(--mu);font-size:13px;list-style:none}
summary::-webkit-details-marker{display:none}
pre{margin:0;padding:2px 16px 14px;overflow:auto;font:12.5px/1.6 ui-monospace,"Cascadia Code",Consolas,monospace;color:#c3d0f5;white-space:pre-wrap;word-break:break-word}
.copy{position:absolute;right:10px;top:6px;border:1px solid var(--ln2);background:transparent;color:var(--mu);border-radius:999px;padding:1px 12px;font:inherit;font-size:12px;cursor:pointer}
.copy:hover{color:var(--tx);border-color:var(--a1)}
details.sql:not([open]) .copy{display:none}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}
.chip{--c:var(--a1);border:1px solid var(--ln2);background:var(--p);color:var(--tx);padding:8px 15px 8px 12px;border-radius:999px;cursor:pointer;font:inherit;font-size:13.5px;text-align:left;transition:.25s;display:inline-flex;align-items:center;gap:9px}
.chip:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.chip:nth-child(4n+2){--c:var(--a2)}.chip:nth-child(4n+3){--c:var(--a3)}.chip:nth-child(4n+4){--c:var(--gold)}
.chip:hover{border-color:var(--c);background:var(--p2);transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.3)}

/* ---------- composer ---------- */
.dock{width:100%;max-width:820px;margin:0 auto;padding:0 28px 14px}
.composer{display:flex;gap:10px;align-items:flex-end;padding:8px 8px 8px 18px;border-radius:26px;background:var(--p2);border:1px solid var(--ln2);transition:.25s}
.composer:focus-within{border-color:var(--a1);box-shadow:0 0 0 4px rgba(91,141,239,.15)}
#q{flex:1;resize:none;max-height:120px;background:transparent;border:0;color:var(--tx);padding:9px 0;font:inherit;outline:none}
#q::placeholder{color:#6d768a}
#send{width:42px;height:42px;border:0;border-radius:50%;cursor:pointer;color:#fff;font-size:17px;background:var(--grad);transition:.25s;flex:none}
#send:hover:not(:disabled){transform:scale(1.08)}
#send:disabled{opacity:.35;cursor:default}
.hint{padding:10px 8px 0;font-size:11.5px;color:#6d768a;text-align:center}

/* ---------- trace: one quiet line, opens into a timeline ---------- */
details.trace{margin-top:18px;border-top:1px solid var(--ln);padding-top:12px}
details.trace>summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px}
.led{width:8px;height:8px;border-radius:50%;background:var(--a2);flex:none}
.led.on{background:var(--a1);animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
.ttl{font-weight:600;color:var(--tx)}
.mtr{color:var(--mu)}
.chev{margin-left:auto;color:var(--mu);font-size:12.5px}
.chev:after{content:" ›";display:inline-block;transition:transform .25s}
details.trace[open] .chev:after{transform:rotate(90deg)}
.chev:hover{color:var(--tx)}
.tbody{padding:14px 0 0 4px}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:4px;top:10px;bottom:10px;width:1px;background:var(--ln2)}
.row{--c:var(--a2);position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;padding:7px 0;animation:rise .4s ease both}
.row:before{content:"";position:absolute;left:-22px;top:13px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--c)}
.row .nm{font-weight:600;font-size:13.5px}
.row .ds{grid-column:1;font-size:12.5px;color:var(--mu);overflow-wrap:anywhere}
.row .rt{grid-row:1/span 2;grid-column:2;text-align:right;font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .rt b{display:block;color:#cdd3e2;font-weight:600}
.row .hop{grid-column:1/-1;font-size:11.5px;color:var(--gold)}
.row.ghost{--c:#6d768a}
.row.ghost:before{border-style:dashed;animation:pulse 1.2s infinite}
.row.ghost .nm{font-weight:400;color:var(--mu)}
.tnote{font-size:11px;color:#6d768a;padding-top:10px}

/* ---------- upload drop zone ---------- */
.drop{display:flex;align-items:center;gap:16px;border:1.5px dashed var(--ln2);border-radius:16px;padding:14px 18px;color:var(--mu);cursor:pointer;transition:.25s;max-width:520px;background:var(--p)}
.drop:hover,.drop.over{border-color:var(--a2);color:var(--tx);background:rgba(63,184,175,.07)}
.drop .ic{flex:none;width:42px;height:42px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:19px}
.drop b{display:block;color:var(--tx);font:600 15px var(--sans)}
.drop span{font-size:12.5px}
.drop input{display:none}
.drop.err{border-color:var(--bad)}.drop.err span{color:var(--bad)}

@media(max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  aside.side{position:fixed;z-index:20;left:0;top:0;bottom:0;width:292px;background:#0e121b;transform:translateX(-100%);transition:transform .3s}
  body.menu-open aside.side{transform:none;box-shadow:12px 0 40px rgba(0,0,0,.5)}
  .mbar{display:flex}
  #chat,.dock{padding-left:16px;padding-right:16px}
  #wake{margin:12px 16px 0}
  .hero b{font-size:42px}.hello h2{font-size:28px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side ns" id="side"></aside>
  <div class="mainc" id="mainc">
    <div class="mbar"><button class="menu" id="menu" type="button">☰ Data</button><span class="muted small">SQL Analyst Agent</span></div>
    <div id="wake"><div class="spin"></div><span>Waking the server up. The free tier sleeps when idle, so this can take about a minute.</span></div>
    <div class="scroller ns" id="scroller"><div id="chat"></div></div>
    <div class="dock">
      <form class="composer" id="form">
        <textarea id="q" rows="1" maxlength="500" placeholder="Ask a question about the data…"></textarea>
        <button id="send" type="submit" aria-label="Send">➤</button>
      </form>
      <div class="hint">Answers come from an LLM and the SQL it wrote, so check the SQL when it matters. Questions are sent to Groq or Gemini.</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
// USD per 1M tokens. PLACEHOLDERS from memory: check each provider's pricing page and edit.
const PRICE = { groq: { in: 0.075, out: 0.30 }, gemini: { in: 0.30, out: 2.50 } };
const NICE = { route: 'Understood', sql_generate: 'Wrote SQL', repair: 'Fixed SQL', sql_validate: 'Safety check', execute: 'Ran query', analyze: 'Wrote answer', finalize: 'Finished' };
const ROUTE_TXT = { answer: 'Can answer this', clarify: 'Needs more detail', cannot_answer: 'Not in this data', refuse_write: 'Read-only app' };
const FINAL_TXT = { answered: 'Answer delivered', clarify: 'Asked you a question', cannot_answer: 'Explained the gap', refuse_write: 'Declined the change', llm_failed: 'Models unavailable', failed: 'Gave up after retries' };
const PAL = ['#5b8def', '#3fb8af', '#8b8cf0', '#d4b26a', '#6cc4e8', '#7fcf9c', '#b79cf0', '#e2c89a'];
const NAVCOL = ['#5b8def', '#3fb8af', '#8b8cf0', '#d4b26a'];

const $ = s => document.querySelector(s);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const fmtMs = ms => ms < 1000 ? ms + ' ms' : (ms / 1000).toFixed(1) + ' s';
const sid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'sid' + Math.random().toString(36).slice(2) + Date.now().toString(36);
let sources = [], current = null, busy = false, uploadInfo = null;
// Everything below uses textContent, never innerHTML: model output and cell values are untrusted.

// Display only: add thousands separators to long numbers in the answer text. Years are left alone.
function prettyNums(s) {
  return String(s).replace(/\b\d{4,}(?:\.\d+)?\b/g, m => {
    const [i, f] = m.split('.');
    if (f === undefined && +i >= 1900 && +i <= 2100) return m;
    return i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (f !== undefined ? '.' + f : '');
  });
}
const humanize = c => String(c).replace(/_/g, ' ').replace(/([a-z])([A-Z])/g, '$1 $2');

function pill(text, color) {
  const p = el('span', 'pill', text); if (color) p.style.setProperty('--c', color); return p;
}

/* ---------- loading, sidebar, source switching ---------- */
async function loadSources() {
  const timer = setTimeout(() => $('#wake').classList.add('show'), 2500);
  for (let i = 0; i < 40; i++) {
    try {
      const r = await fetch('/api/sources');
      if (r.ok) { sources = await r.json(); clearTimeout(timer); $('#wake').classList.remove('show'); return init(); }
    } catch (e) {}
    await new Promise(r => setTimeout(r, 3000));
  }
  $('#wake').lastElementChild.textContent = 'Could not reach the server. Please reload the page in a minute.';
}

function init() { select(sources[0].id, true); }

function select(id, force) {
  if (busy && !force) return;
  current = id;
  document.body.classList.remove('menu-open');
  renderSide();
  $('#chat').replaceChildren();
  if (id === 'upload') uploadWelcome(); else welcome();
}

function notesBox() {
  const box = el('div', 'notes');
  box.append(el('h4', null, 'About this data'),
    el('p', null, 'Optional. Say what columns or codes mean, for example "amount is in euros" or "status 3 means cancelled". Up to 500 characters.'));
  const ta = document.createElement('textarea');
  ta.maxLength = 500; ta.rows = 4; ta.value = uploadInfo.notes || '';
  ta.placeholder = 'Type your definitions here…';
  const foot = el('div', 'nfoot'), st = el('span', 'st', ta.value ? 'Saved.' : ''), btn = el('button', 'savebtn', 'Save');
  btn.type = 'button';
  ta.addEventListener('input', () => { st.className = 'st'; st.textContent = ta.value.length + ' / 500'; });
  btn.onclick = async () => {
    if (!uploadInfo) return;
    btn.disabled = true; st.className = 'st'; st.textContent = 'Saving…';
    try {
      const r = await fetch('/api/upload/notes', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sid, notes: ta.value }) });
      if (!r.ok) {
        const msg = await errText(r);
        if (/upload a csv/i.test(msg)) {
          uploadInfo = null; renderSide();
          if (current === 'upload') { $('#chat').replaceChildren(); uploadWelcome(); }
          return;
        }
        st.className = 'st bad'; st.textContent = msg; return;
      }
      const j = await r.json();
      uploadInfo.notes = j.notes; ta.value = j.notes;
      st.textContent = j.notes ? 'Saved. Used from your next question.' : 'Cleared.';
    } catch (e) {
      st.className = 'st bad'; st.textContent = 'Could not save. Is the server running?';
    } finally { btn.disabled = false; }
  };
  foot.append(st, btn); box.append(ta, foot);
  return box;
}

function aboutCard() {
  const card = el('div', 'card');
  if (current === 'upload') {
    if (!uploadInfo) {
      card.append(el('h3', null, 'No file yet'), el('p', null, 'Drop a CSV in the chat area. It is kept in server memory for about 30 minutes and the app does not save it.'));
      return card;
    }
    const p = uploadInfo;
    card.append(el('h3', null, p.filename));
    const st = el('div', 'stats');
    st.append(pill(p.rows.toLocaleString() + ' rows', '#3fb8af'), pill(p.columns.length + ' columns', '#5b8def'), pill(p.encoding, '#d4b26a'));
    card.append(st);
    const cols = el('div', 'cols');
    p.columns.forEach(c => {
      const s = el('span', 'col ' + String(c.type).toLowerCase(), c.name); s.title = 'Original header: ' + c.original;
      s.append(el('i', null, TYPE_TXT[c.type] || c.type)); cols.append(s);
    });
    card.append(cols, notesBox());
    const again = el('button', 'linkbtn', 'Use a different file'); again.type = 'button';
    again.onclick = () => { if (busy) return; uploadInfo = null; renderSide(); $('#chat').replaceChildren(); uploadWelcome(); };
    card.append(again);
    return card;
  }
  const s = sources.find(x => x.id === current);
  if (!s) return card;
  card.append(el('h3', null, s.label), el('p', null, s.description));
  const st = el('div', 'stats');
  if (s.tables != null) st.append(pill(s.tables + (s.tables === 1 ? ' table' : ' tables'), '#3fb8af'));
  st.append(pill('read-only', '#5b8def'));
  card.append(st);
  (s.schema || []).forEach(t => {
    const d = el('details', 'tbl'), sm = el('summary'); sm.append(document.createTextNode(t.name), el('span', null, (t.columns || []).length + ' cols'));
    const cols = el('div', 'cols');
    (t.columns || []).forEach(c => { const x = el('span', 'col ' + String(c.type || '').toLowerCase(), c.name); if (c.type) x.append(el('i', null, String(c.type).toLowerCase())); cols.append(x); });
    d.append(sm, cols); card.append(d);
  });
  return card;
}

function renderSide() {
  const side = $('#side'); side.replaceChildren();
  const brand = el('div', 'brand'), t = el('div');
  t.append(el('h1', null, 'SQL Analyst Agent'), el('div', null, 'Plain English to checked SQL'));
  brand.append(el('div', 'logo', 'S'), t);
  const navWrap = el('div'), nav = el('div', 'nav');
  navWrap.append(el('div', 'sec', 'Data source'), nav);
  const items = sources.map(s => ({ id: s.id, label: s.label })).concat([{ id: 'upload', label: 'Upload CSV' }]);
  items.forEach((it, i) => {
    const b = el('button', 'navbtn' + (it.id === current ? ' on' : ''), it.label); b.type = 'button';
    b.style.setProperty('--c', NAVCOL[i % NAVCOL.length]);
    b.onclick = () => select(it.id);
    nav.append(b);
  });
  const aboutWrap = el('div');
  aboutWrap.append(el('div', 'sec', 'Data details'), aboutCard());
  side.append(brand, navWrap, aboutWrap, el('div', 'priv', 'Questions, column names and a few sample values are sent to a third-party LLM (Groq or Gemini). Do not upload confidential data.'));
}

function chipRow(list) {
  const row = el('div', 'chips');
  list.forEach(t => { const b = el('button', 'chip', t); b.type = 'button'; b.onclick = () => ask(t); row.append(b); });
  return row;
}

function welcome() {
  const s = sources.find(x => x.id === current);
  const w = el('div', 'msg bot hello'); w.id = 'welcome';
  w.append(el('h2', null, 'Ask ' + s.label + ' anything'), el('p', 'muted', s.description), el('div', 'muted small', 'Try one of these:'), chipRow(s.examples));
  $('#chat').append(w);
}

/* ---------- trace: one quiet line that opens into a timeline ---------- */
function newJourney() {
  const root = el('details', 'trace'); root.open = true;
  const sum = el('summary'), led = el('span', 'led on'), title = el('span', 'ttl', 'Working…'), mtr = el('span', 'mtr'), chev = el('span', 'chev', 'Details');
  sum.append(led, title, mtr, chev);
  const body = el('div', 'tbody'), tl = el('div', 'tl'), note = el('div', 'tnote');
  note.style.display = 'none';
  body.append(tl, note); root.append(sum, body);
  const J = { root, tl, note, led, title, mtr, cost: 0 };
  addGhost(J, 'Starting…');
  return J;
}

function addGhost(J, text) {
  J.tl.querySelector('.ghost')?.remove();
  const r = el('div', 'row ghost'); r.append(el('div', 'nm', text || 'Working…')); J.tl.append(r);
}

function stepColor(ev) {
  const d = String(ev.decision || '').toLowerCase();
  if (d.includes('llm_failed')) return '#d98593';
  if (d.includes('blocked') || d.includes('error') || d.includes('empty')) return '#d4b26a';
  return '#3fb8af';
}

function friendly(ev) {
  const d = String(ev.decision || '');
  if (ev.node === 'route') return ROUTE_TXT[d] || d;
  if (ev.node === 'finalize') return FINAL_TXT[d] || d;
  if (ev.node === 'sql_validate') return d === 'ok' ? 'Passed: single SELECT, allowed tables' + (ev.detail ? ' (' + ev.detail + ')' : '') : 'Blocked: ' + (ev.detail || d);
  if (ev.node === 'execute' && ev.detail) return d + ': ' + ev.detail;
  return d;
}

function addStep(J, ev) {
  J.tl.querySelector('.ghost')?.remove();
  const p = ev.provider && PRICE[ev.provider];
  if (p) J.cost += ((ev.tokens_in || 0) * p.in + (ev.tokens_out || 0) * p.out) / 1e6;
  const r = el('div', 'row');
  r.style.setProperty('--c', stepColor(ev));
  r.append(el('div', 'nm', NICE[ev.node] || String(ev.node).replace('_', ' ')));
  const sub = friendly(ev); if (sub) r.append(el('div', 'ds', sub));
  const ms = ev.node_ms ?? ev.latency_ms;
  const rt = el('div', 'rt');
  if (ms != null && ev.node !== 'finalize') rt.append(el('b', null, fmtMs(ms)));
  const bits = [];
  if (ev.provider) bits.push(ev.provider);
  if (ev.tokens_in != null) bits.push(ev.tokens_in + '→' + ev.tokens_out + ' tok');
  if (bits.length) rt.append(document.createTextNode(bits.join(' · ')));
  if (rt.childNodes.length) r.append(rt);
  if ((ev.fallback_errors || []).length) {
    const text = ev.fallback_errors.map(String).join(' ');
    r.append(el('div', 'hop', /rate limit|429/i.test(text) ? 'Rate limit hit and handled' : 'Switched provider'));
  }
  J.tl.append(r);
  if (ev.node !== 'finalize') addGhost(J, 'Working…');
}

function finishJourney(J, t) {
  J.tl.querySelector('.ghost')?.remove();
  J.led.classList.remove('on');
  J.title.textContent = 'Done';
  if (!t) return;
  const bits = [fmtMs(t.wall_ms || 0), t.llm_calls + (t.llm_calls === 1 ? ' model call' : ' model calls'),
    ((t.tokens_in || 0) + (t.tokens_out || 0)).toLocaleString() + ' tokens'];
  if (t.revisions) bits.push(t.revisions + (t.revisions === 1 ? ' revision' : ' revisions'));
  bits.push('≈ $' + J.cost.toFixed(5) + ' est.');
  J.mtr.textContent = bits.join('  ·  ');
  J.note.textContent = 'Cost is an estimate at list price (' + ((t.providers || []).join(' + ') || 'n/a') + '). Real spend is $0 on free tiers.';
  J.note.style.display = 'block';
  J.root.open = false; // the answer is the focus; the timeline folds away
}

/* ---------- answer rendering ---------- */
function fmt(v, col) {
  if (v === null || v === undefined) return '—';
  if (typeof v === 'number') return /id$/i.test(col) ? String(v) : v.toLocaleString(undefined, { maximumFractionDigits: 2 });
  return String(v);
}

function table(cols, rows, trunc) {
  const w = el('div'), wrap = el('div', 'tablewrap ns'), t = el('table'), hr = el('tr');
  cols.forEach(c => hr.append(el('th', null, c)));
  const th = el('thead'); th.append(hr); t.append(th);
  const tb = el('tbody');
  rows.forEach(r => { const tr = el('tr'); r.forEach((v, i) => tr.append(el('td', typeof v === 'number' ? 'num' : null, fmt(v, cols[i])))); tb.append(tr); });
  t.append(tb); wrap.append(t);
  w.append(wrap, el('div', 'muted small', rows.length + (rows.length === 1 ? ' row' : ' rows') + (trunc ? ' shown (the result was cut off at the row limit)' : '')));
  return w;
}

function sqlBox(sql, label) {
  const d = el('details', 'sql'); d.append(el('summary', null, label || 'SQL that ran'));
  const pre = el('pre', 'ns'); pre.append(el('code', null, sql || '')); d.append(pre);
  const b = el('button', 'copy', 'Copy'); b.type = 'button';
  b.onclick = async () => {
    try { await navigator.clipboard.writeText(sql || ''); b.textContent = 'Copied'; } catch (e) { b.textContent = 'Copy failed'; }
    setTimeout(() => b.textContent = 'Copy', 1500);
  };
  d.append(b); return d;
}

function drawChart(cv, spec, cols, rows) {
  const xi = cols.indexOf(spec.x), yi = cols.indexOf(spec.y);
  const labels = rows.map(r => String(r[xi])), vals = rows.map(r => r[yi]);
  const each = rows.map((_, i) => PAL[i % PAL.length]);
  Chart.defaults.font.family = 'ui-sans-serif,system-ui,sans-serif';
  Chart.defaults.color = '#8a93a6';
  const opts = { responsive: true, maintainAspectRatio: false, animation: { duration: 1000, easing: 'easeOutQuart' },
    plugins: { legend: { display: false },
      tooltip: { backgroundColor: '#151a26', borderColor: 'rgba(255,255,255,.14)', borderWidth: 1, padding: 10, cornerRadius: 10 },
      title: { display: !!spec.title, text: spec.title, color: '#e8ecf4', font: { size: 13, weight: '600' }, padding: { bottom: 12 } } } };
  const axis = (name, grid) => ({ grid: { display: grid, color: 'rgba(255,255,255,.06)' }, border: { display: false }, ticks: { color: '#8a93a6' }, title: { display: true, text: name, color: '#6d768a' } });
  let cfg;
  if (spec.type === 'pie') {
    opts.plugins.legend = { display: true, position: 'right', labels: { color: '#cdd3e2', boxWidth: 10, usePointStyle: true } };
    opts.cutout = '62%';
    cfg = { type: 'doughnut', data: { labels, datasets: [{ data: vals, backgroundColor: each, borderColor: '#10141d', borderWidth: 3, hoverOffset: 8 }] }, options: opts };
  } else if (spec.type === 'scatter') {
    opts.scales = { x: axis(spec.x, false), y: axis(spec.y, true) };
    cfg = { type: 'scatter', data: { datasets: [{ data: rows.map(r => ({ x: r[xi], y: r[yi] })), backgroundColor: each, pointRadius: 6, pointHoverRadius: 8 }] }, options: opts };
  } else if (spec.type === 'line') {
    opts.scales = { x: axis(spec.x, false), y: axis(spec.y, true) };
    const g = cv.getContext('2d').createLinearGradient(0, 0, 0, 300);
    g.addColorStop(0, 'rgba(91,141,239,.38)'); g.addColorStop(1, 'rgba(63,184,175,0)');
    cfg = { type: 'line', data: { labels, datasets: [{ data: vals, borderColor: '#5b8def', backgroundColor: g, fill: true, tension: .35, borderWidth: 3, pointBackgroundColor: each, pointBorderColor: '#10141d', pointBorderWidth: 2, pointRadius: 4, pointHoverRadius: 7 }] }, options: opts };
  } else {
    opts.scales = { x: axis(spec.x, false), y: Object.assign(axis(spec.y, true), { beginAtZero: true }) };
    cfg = { type: 'bar', data: { labels, datasets: [{ data: vals, borderRadius: 8, backgroundColor: each, maxBarThickness: 56 }] }, options: opts };
  }
  new Chart(cv, cfg);
}

function showError(body, msg) {
  body.replaceChildren(el('span', 'tag bad', 'Error'), el('p', 'answer plain', msg));
}

function renderFinal(body, f) {
  body.replaceChildren();
  if (f.status !== 'answered') {
    const tag = { clarify: ['Need a bit more detail', ''], cannot_answer: ['Not in this data', ''], refuse_write: ['Read-only app', 'bad'],
      llm_failed: ['Language models unavailable', 'bad'], failed: ['Could not build a working query', 'bad'] }[f.status] || ['Notice', ''];
    body.append(el('span', 'tag ' + tag[1], tag[0]), el('p', 'answer plain', f.message));
    if (f.suggestions && f.suggestions.length) body.append(el('div', 'muted small', 'You could ask instead:'), chipRow(f.suggestions));
    if (f.status === 'failed' && f.last_sql) body.append(sqlBox(f.last_sql + (f.last_error ? '\n\n-- ' + f.last_error : ''), 'Last attempt'));
    return;
  }
  if (f.columns.length === 1 && f.rows.length === 1 && typeof f.rows[0][0] === 'number') {
    const h = el('div', 'hero');
    h.append(el('b', null, fmt(f.rows[0][0], f.columns[0])), el('span', null, humanize(f.columns[0])));
    body.append(h);
  }
  body.append(el('p', 'answer', prettyNums(f.message)));
  (f.caveats || []).forEach(c => { const n = el('div', 'note'); n.append(el('span', null, '!'), el('span', null, c)); body.append(n); });
  if (f.chart && window.Chart) {
    const box = el('div', 'chartbox'), cv = el('canvas'); box.append(cv); body.append(box);
    try { drawChart(cv, f.chart, f.columns, f.rows); } catch (e) { box.remove(); }
  }
  body.append(table(f.columns, f.rows, f.truncated), sqlBox(f.sql));
}

async function errText(r) {
  try {
    const j = await r.json();
    if (typeof j.detail === 'string') return j.detail;
    if (r.status === 422) return 'That question could not be accepted. Please keep it under 500 characters.';
  } catch (e) {}
  return 'Server error (' + r.status + '). Please try again.';
}

async function readSSE(r, on) {
  const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '';
  for (;;) {
    const { value, done } = await rd.read(); if (done) break;
    buf += dec.decode(value, { stream: true }).replace(/\r\n/g, '\n');
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const block = buf.slice(0, i); buf = buf.slice(i + 2);
      let name = 'message', data = null;
      for (const line of block.split('\n')) {
        if (line.startsWith('event: ')) name = line.slice(7);
        else if (line.startsWith('data: ')) { try { data = JSON.parse(line.slice(6)); } catch (e) {} }
      }
      if (data !== null) on(name, data);
    }
  }
}

function setBusy(b) { busy = b; $('#send').disabled = b; }
const toBottom = () => { const c = $('#scroller'); c.scrollTop = c.scrollHeight; };

async function ask(text) {
  text = (text || '').trim();
  if (!text || busy || !current) return;
  if (current === 'upload' && !uploadInfo) return;
  setBusy(true);
  $('#welcome')?.remove();
  const chat = $('#chat');
  chat.append(el('div', 'msg user', text));
  const card = el('div', 'msg bot'), body = el('div');
  const think = el('div', 'think'), dots = el('div', 'dots'), label = el('span', 'muted small', 'Thinking…');
  for (let i = 0; i < 3; i++) dots.append(el('span'));
  think.append(dots, label); body.append(think);
  const J = newJourney();
  card.append(body, J.root); chat.append(card);
  toBottom();
  let got = false, totals = null;
  try {
    const r = await fetch('/api/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sid, source: current, question: text }) });
    if (!r.ok) throw new Error(await errText(r));
    await readSSE(r, (name, d) => {
      if (name === 'trace') { addStep(J, d); label.textContent = (NICE[d.node] || d.node) + ' ✓'; toBottom(); }
      else if (name === 'final') { got = true; totals = d.totals; renderFinal(body, d); toBottom(); }
      else if (name === 'error') { got = true; showError(body, d.message); }
    });
    if (!got) showError(body, 'The connection closed before an answer arrived. Please try again.');
  } catch (e) {
    if (current === 'upload' && /upload a csv/i.test(e.message || '')) { uploadInfo = null; renderSide(); }
    showError(body, e.message || 'Network error. Is the server running?');
  } finally {
    finishJourney(J, totals);
    setBusy(false); toBottom(); $('#q').focus();
  }
}

const q = $('#q');
$('#form').addEventListener('submit', e => { e.preventDefault(); const t = q.value; q.value = ''; q.style.height = 'auto'; ask(t); });
q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#form').requestSubmit(); } });
q.addEventListener('input', () => { q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 120) + 'px'; });
$('#menu').onclick = () => document.body.classList.toggle('menu-open');
$('#mainc').addEventListener('click', () => document.body.classList.remove('menu-open'));
// Scrolling the mouse wheel anywhere outside the sidebar and the chat area (header, composer, margins) scrolls the chat.
document.addEventListener('wheel', e => {
  if (e.ctrlKey || e.target.closest('#scroller') || e.target.closest('#side')) return;
  $('#scroller').scrollTop += e.deltaY;
}, { passive: true });

/* ---------- CSV upload ---------- */
const MAX_UPLOAD = 5 * 1024 * 1024;
const TYPE_TXT = { INTEGER: 'integer', REAL: 'decimal', TEXT: 'text', DATE_TEXT: 'date' };
const DROP_TITLE = 'Drop a CSV here, or click to browse';

function dropZone() {
  const zone = el('label', 'drop'), input = document.createElement('input');
  input.type = 'file'; input.accept = '.csv,.tsv,.txt,text/csv,text/plain';
  const txt = el('div'), title = el('b', null, DROP_TITLE), msg = el('span', null, 'One file · up to 5 MB and 100,000 rows');
  txt.append(title, msg);
  zone.append(input, el('div', 'ic', '⇪'), txt);
  const fail = t => { title.textContent = DROP_TITLE; zone.classList.add('err'); msg.textContent = t; };
  const go = async file => {
    if (!file) return;
    zone.classList.remove('err');
    if (file.size > MAX_UPLOAD) return fail('That file is larger than 5 MB.');
    title.textContent = 'Reading ' + file.name + '…'; msg.textContent = 'Detecting columns and types';
    const fd = new FormData(); fd.append('session_id', sid); fd.append('file', file);
    try {
      const r = await fetch('/api/upload', { method: 'POST', body: fd });
      if (!r.ok) return fail(await errText(r));
      uploadInfo = await r.json();
      if (current === 'upload') { renderSide(); $('#chat').replaceChildren(); uploadWelcome(); }
    } catch (e) { fail('Upload failed. Is the server running?'); }
  };
  input.onchange = () => go(input.files[0]);
  ['dragenter', 'dragover'].forEach(t => zone.addEventListener(t, e => { e.preventDefault(); zone.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(t => zone.addEventListener(t, e => { e.preventDefault(); zone.classList.remove('over'); }));
  zone.addEventListener('drop', e => go(e.dataTransfer.files[0]));
  return zone;
}

function uploadChips(p) {
  const out = ['How many rows are there?'];
  const num = p.columns.find(c => c.type === 'INTEGER' || c.type === 'REAL');
  const txt = p.columns.find(c => c.type === 'TEXT');
  if (num) out.push('What is the average ' + num.name.replace(/_/g, ' ') + '?');
  if (txt) out.push('How many rows are there for each ' + txt.name.replace(/_/g, ' ') + '?');
  return out;
}

function uploadWelcome() {
  const w = el('div', 'msg bot hello'); w.id = 'welcome';
  if (!uploadInfo) {
    w.append(el('h2', null, 'Chat with your own CSV'),
      el('p', 'muted', 'Drop a file and ask questions about it in plain English.'),
      dropZone());
  } else {
    w.append(el('h2', null, 'Ask your data anything'));
    (uploadInfo.warnings || []).forEach(t => { const n = el('div', 'note'); n.append(el('span', null, '!'), el('span', null, t)); w.append(n); });
    w.append(el('div', 'muted small', 'Try one of these:'), chipRow(uploadChips(uploadInfo)),
      el('p', 'muted small', 'Tip: if your columns use codes or short names, explain them under "About this data" in the sidebar for better answers.'));
  }
  $('#chat').append(w);
}

loadSources();
